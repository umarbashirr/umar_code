# The PowerShell install line downloads an .exe from the GitHub release.
#
# This job is no longer the only way to get one. node-pty 1.1.0 ships N-API
# prebuilds for win32-x64 in its npm package, so nothing has to compile on
# Windows any more, and the installer cross-builds from Linux inside
# electronuserland/builder:wine. See docs in the release notes, or:
#
#   docker run --rm -v "$PWD":/project -v /tmp/win-out:/out \
#     -v "$HOME/.cache/electron":/root/.cache/electron \
#     -v "$HOME/.cache/electron-builder":/root/.cache/electron-builder \
#     electronuserland/builder:wine \
#     bash -c "cd /project && npx electron-builder --win nsis \
#       -c.npmRebuild=false -c.directories.output=/out"
#
# npmRebuild=false is the load-bearing flag: a rebuild on Linux would replace
# the shipped win32 prebuild with a Linux one.
#
# The job stays as a fallback for anyone without docker, and to catch up a
# release that shipped without the .exe. It runs when a release is published,
# and can be started by hand against an existing tag.

name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the installer to, for example v0.8.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  dist-win:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron
            ~\AppData\Local\electron-builder
          key: win-electron-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Build the installer
        run: npm run dist:win

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/tandem-*-x64.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no NSIS installer in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
